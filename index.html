body{

}
header{
  background:#101a2d;

  border-bottom:1px solid #263854

main{max-width:700px;margin:auto;padding:16px}

  padding:16px;

h2{font-size:18px}
input,textarea{
  display:block;

  color:white;

.secondary{background:#23344f;color:white}
.row{display:flex;gap:8px;margin-top:12px}

}
.muted,small{color:#aebbd0;line-height:1.9}
#messages{
  display:flex;
  flex-direction:column;

.msg{
  padding:12px;

.user{background:#17345a;align-self:flex-start}
.bot{background:#1a2638;align-self:stretch}
#preview{max-width:100%;max-height:220px;display:none;margin:10px 0}
#status{color:#83c5ff;line-height:1.9}

</head>
