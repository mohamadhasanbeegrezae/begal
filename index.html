<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d1b">
<title>بگال | دستیار هوشمند</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d1b;color:#f5f7ff;
 font-family:Tahoma,Arial,sans-serif;line-height:1.9
}
.container{max-width:760px;margin:auto;padding:16px}
header{
 display:flex;align-items:center;justify-content:space-between;
 padding:12px 0;border-bottom:1px solid #243452
}
.logo{font-size:25px;font-weight:bold;color:#66aaff}
.badge{background:#172746;border-radius:20px;padding:5px 12px;font-size:12px}
.hero{text-align:center;padding:24px 0}
.hero h1{font-size:30px;margin:8px 0;color:#72adff}
.hero p,.muted{color:#a8b7d3;font-size:13px}
.card{
 background:#101a30;border:1px solid #293d60;
 border-radius:18px;padding:18px;margin:15px 0
}
h2{font-size:18px;margin:0 0 8px}
button,input,textarea{font-family:inherit}
button{
 border:0;border-radius:11px;padding:12px;
 background:#397bff;color:white;font-size:14px;
 cursor:pointer
}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{
 width:100%;background:#0b1427;color:white;
 border:1px solid #334768;border-radius:11px;
 padding:12px;font-size:15px
}
textarea{resize:vertical;min-height:55px}
.row{display:flex;gap:8px;align-items:center}
.row button{white-space:nowrap}
#chat{height:300px;overflow-y:auto;margin:12px 0}
.msg{padding:11px 13px;border-radius:13px;margin:9px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#1a3155;margin-right:25px}
.bot{background:#182033;margin-left:25px}
.plan{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;background:#0b1427;border:1px solid #2c4166;
 padding:12px;border-radius:12px;margin:10px 0
}
.price{color:#8fbdff;font-weight:bold;white-space:nowrap}
.bank{
 text-align:center;background:#142644;border:1px solid #375b91;
 border-radius:15px;padding:16px;margin:14px 0
}
.number{direction:ltr;font-size:21px;font-weight:bold;letter-spacing:1px}
.full{width:100%;margin-top:10px}
.notice{font-size:12px;color:#f1d69b;background:#302819;padding:12px;border-radius:10px;margin-top:12px}
.hidden{display:none}
.status{font-size:13px;color:#9cebd0;margin-top:10px}
footer{text-align:center;color:#7f91b3;font-size:12px;padding:20px}
</style>
</head
