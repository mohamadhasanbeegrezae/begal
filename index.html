<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>بگال | دستیار هوشمند فارسی</title>

<style>
:root {
  --bg: #080d18;
  --panel: #111c2e;
  --panel2: #17243a;
  --border: #263955;
  --blue: #2864e8;
  --light: #80b7ff;
  --text: #f4f7ff;
  --muted: #9eacc2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
  min-height: 100vh;
}

header {
  height: 66px;
  background: #101a2b;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  position: sticky;
  top: 0;
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 39px;
  height: 39px;
  border-radius: 13px;
  background: linear-gradient(135deg, #347cff, #153b91);
  display: grid;
  place-items: center;
  font-size: 21px;
  font-weight: bold;
}

.brand h1 {
  color: var(--light);
  font-size: 22px;
  margin: 0;
}

.new-chat {
  width: auto;
  min-height: 38px;
  padding: 7px 12px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: white;
  font: inherit;
  cursor: pointer;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 18px 13px 20px;
}

.welcome {
  text-align: center;
  padding: 35px 12px 22px;
}

.welcome h2 {
  color: var(--light);
  font-size: 25px;
  margin: 0 0 8px;
}

.welcome p {
  color: var(--muted);
  font-size: 14px;
  margin: 0;
}

.quota {
  background: #101d32;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 11px 14px;
  margin: 5px 0 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}

#remaining {
  color: var(--light);
  font-weight: bold;
}

#messages {
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding: 8px 0 20px;
}

.msg-row {
  display: flex;
  gap: 9px;
  align-items: flex-start;
}

.msg-row.user {
  flex-direction: row-reverse;
}

.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: #1c3765;
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.msg-row.assistant .avatar {
  background: linear-gradient(135deg, #347cff, #153b91);
}

.bubble {
  max-width: 85%;
  padding: 12px 15px;
  border-radius: 15px;
  background: var(--panel2);
  border: 1px solid var(--border);
  line-height: 2;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user .bubble {
  background: #19386d;
  border-color: #2855a0;
}

.composer {
  position: sticky;
  bottom: 0;
  background: linear-gradient(transparent, var(--bg) 18%);
  padding: 18px 0 10px;
}

.input-box {
  display: flex;
  align-items: flex-end;
  gap: 9px;
  background: #111d30;
  border: 1px solid #344967;
  border-radius: 17px;
  padding: 10px;
  box-shadow: 0 8px 30px #0005;
}

textarea {
  flex: 1;
  min-width: 0;
  min-height: 42px;
  max-height: 150px;
  resize: none;
  border: 0;
  outline: none;
  background: transparent;
  color: white;
  font: inherit;
  font-size: 14px;
  line-height: 1.9;
  padding: 7px;
}

textarea::placeholder {
  color: #8b9bb3;
}

#send {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  border: 0;
  border-radius: 12px;
  background: var(--blue);
  color: white;
  font-size: 20px;
  cursor: pointer;
}

#send:disabled {
  opacity: .5;
}

.status {
  min-height: 23px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding-top: 5px;
}

footer {
  text-align: center;
  color: #71819a;
  font-size: 11px;
  padding: 5px 0 15px;
}

@media (max-width: 480px) {
  main {
    padding: 10px 10px 15px;
  }

  .welcome {
    padding-top: 27px;
  }

  .welcome h2 {
    font-size: 22px;
  }

  .bubble {
    max-width: 88%;
    font-size: 13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">ب</div>
    <h1>بگال</h1>
  </div>

  <button class="new-chat" id="newChat">＋ گفت‌وگوی جدید</button>
</header>

<main>

  <section class="welcome" id="welcome">
    <h2>سلام! من بگال هستم 👋</h2>
    <p>دستیار هوشمند فارسی؛ سؤالت را بپرس تا کمکت کنم.</p>
  </section>

  <section class="quota">
    <span>🎁 سهمیه سؤال‌های رایگان</span>
    <span id="remaining">۱۰ سؤال باقی‌مانده</span>
  </section>

  <section id="messages" aria-live="polite">
    <div class="msg-row assistant">
      <div class="avatar">ب</div>
      <div class="bubble">
        سلام! خوش آمدی 🌟

        من بگال هستم. می‌توانی درباره درس، علم، فناوری و موضوعات مختلف از من سؤال بپرسی.
      </div>
    </div>
  </section>

  <section class="composer">
    <form id="chatForm">
      <div class="input-box">
        <textarea
          id="question"
          rows="1"
          placeholder="پیامت را برای بگال بنویس..."
          autocomplete="off"
        ></textarea>

        <button type="submit" id="send" aria-label="ارسال">➤</button>
      </div>
      <div id="chatStatus" class="status"></div>
    </form>
  </section>

  <footer>
    بگال | دستیار هوشمند فارسی شما
  </footer>

</main>

<script>
(() => {
  const API = "https://begal.onrender.com";
  const LIMIT = 10;
  const STORAGE_KEY = "begal_questions_used_v1";

  const $ = id => document.getElementById(id);

  let used = 0;
  let messages = [];

  try {
    used = Math.max(
      0,
      Math.min(LIMIT, Number(localStorage.getItem(STORAGE_KEY)) || 0)
    );
  } catch (e) {}

  function updateQuota() {
    $("remaining").textContent =
      Math.max(0, LIMIT - used) + " سؤال باقی‌مانده";
  }

  function status(message) {
    $("chatStatus").textContent = message;
  }

  function addMessage(text, role) {
    const row = document.createElement("div");
    row.className = "msg-row " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "ش" : "ب";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    $("messages").appendChild(row);

    row.scrollIntoView({
      behavior: "smooth",
      block: "end"
    });
  }

  function resizeInput() {
    const box = $("question");
    box.style.height = "auto";
    box.style.height = Math.min(box.scrollHeight, 150) + "px";
  }

  $("question").addEventListener("input", resizeInput);

  $("newChat").addEventListener("click", () => {
    messages = [];
    $("messages").innerHTML = "";

    addMessage(
      "سلام! من بگال هستم. سؤالت را بنویس تا کمکت کنم.",
      "assistant"
    );

    status("");
    $("question").value = "";
    resizeInput();
  });

  $("chatForm").addEventListener("submit", async event => {
    event.preventDefault();

    const question = $("question").value.trim();

    if (!question) {
      status("لطفاً ابتدا سؤالت را بنویس.");
      return;
    }

    if (used >= LIMIT) {
      status("۱۰ سؤال رایگان تمام شده است.");
      return;
    }

    $("send").disabled = true;
    status("بگال در حال فکر کردن است...");

    addMessage(question, "user");

    const nextMessages = [
      ...messages,
      { role: "user", content: question }
    ];

    try {
      const response = await fetch(API + "/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: nextMessages
        })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "خطا در دریافت پاسخ");
      }

      const answer =
        data.choices?.[0]?.message?.content ||
        data.reply ||
        data.answer;

      if (!answer) {
        throw new Error("پاسخ خالی دریافت شد.");
      }

      const answerText =
        typeof answer === "string"
          ? answer
          : JSON.stringify(answer);

      messages = [
        ...nextMessages,
        { role: "assistant", content: answer }
      ];

      addMessage(answerText, "assistant");

      used++;
      try {
        localStorage.setItem(STORAGE_KEY, String(used));
      } catch (e) {}

      updateQuota();

      $("question").value = "";
      resizeInput();
      status("");

    } catch (error) {
      status("پاسخ دریافت نشد. اتصال سرور را بررسی کن.");
    } finally {
      $("send").disabled = false;
      $("question").focus();
    }
  });

  $("question").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      $("chatForm").requestSubmit();
    }
  });

  updateQuota();
})();
</script>

</body>
</html>
