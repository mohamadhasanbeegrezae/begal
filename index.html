<script>
const API_URL = "https://begal.onrender.com/chat";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const counter = document.getElementById("counter");

const savedRemaining = localStorage.getItem("begal_remaining");
let remaining = savedRemaining === null ? 10 : Number(savedRemaining);

if (!Number.isInteger(remaining) || remaining < 0 || remaining > 10) {
  remaining = 10;
  localStorage.setItem("begal_remaining", "10");
}

const history = [];

function updateCounter() {
  counter.textContent = remaining + " سؤال رایگان باقی مانده";
}

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "message " + who;
  div.textContent = text;
  chat.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

updateCounter();

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const question = input.value.trim();
  if (!question || send.disabled) return;

  if (remaining <= 0) {
    addMessage("سؤال‌های رایگان تمام شده‌اند. برای ادامه اشتراک لازم است.", "bot");
    return;
  }

  addMessage(question, "user");
  input.value = "";
  send.disabled = true;
  send.textContent = "در حال ارسال...";

  history.push({ role: "user", content: question });
  const loading = addMessage("در حال دریافت پاسخ...", "bot");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        typeof data.error === "string"
          ? data.error
          : data.error?.message || "خطای سرور: " + response.status
      );
    }

    const answer = data.choices?.[0]?.message?.content;

    if (!answer) {
      throw new Error("پاسخ معتبری از هوش مصنوعی دریافت نشد.");
    }

    loading.textContent = answer;
    history.push({ role: "assistant", content: answer });

    remaining--;
    localStorage.setItem("begal_remaining", String(remaining));
    updateCounter();

  } catch (error) {
    loading.textContent = "پاسخی دریافت نشد: " + error.message;
    history.pop();
  } finally {
    send.disabled = false;
    send.textContent = "ارسال";
  }
});
</script>
